services:
  backend:
    build:
      context: .
      dockerfile: DockerFile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor        # preserve composer deps from image build
      - storage_data:/var/www/html/storage      # preserve storage/ permissions
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cost-cal
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cost_cal_net
      - backend_internal

  db:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cost-cal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cost-cal"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend_internal

volumes:
  pgdata:
  vendor_data:
  storage_data:

networks:
  cost_cal_net:
    external: true
  backend_internal:
    driver: bridge
